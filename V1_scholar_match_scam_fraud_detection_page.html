<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered scholarship finder">
    <title>AI Scholarship Finder - Home</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>
<body>
 
    <!-- Header / Navbar -->
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <a href="home.html" class="logo">
                    <img src="images/logo.png" alt="ScholarMatch Logo" class="logo-icon">
                    <h1 class="logo-text">ScholarMatch</h1>
                </a>
                <nav class="nav" role="navigation" aria-label="Main navigation">
                    <ul class="nav-list">
                        <li><a href="#home" class="nav-link">Ralph</a></li>
                        <li><a href="https://tohwangxin.github.io/C240_FA/" target="_blank" class="nav-link">WangXin</a></li>
                        <li><a href="#how-it-works" class="nav-link">Raelyn</a></li>
                        <li><a href="#about" class="nav-link">Ee Weng</a></li>
                        <li><a href="#about" class="nav-link">Aung Myin</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

  <div class="container">
    <div class="card">
      <h2>Paste the Scholarship Offer / Message</h2>
      <textarea id="offerText" placeholder="Example: Congratulations! You have been selected... Please pay a processing fee to receive your scholarship..."></textarea>
      <br><br>
      <button id="checkBtn">Check for Scam Signals</button>

      <div id="analysis" class="result" style="display:none"></div>
    </div>
  </div>

  <script>
    const checkBtn = document.getElementById('checkBtn');
    const offerText = document.getElementById('offerText');
    const analysis = document.getElementById('analysis');

    function analyzeText(text) {
      const redFlags = [];

      const lower = text.toLowerCase();

      if (lower.includes('processing fee') || lower.includes('administrative fee') || lower.includes('payment first') || lower.includes('bank transfer')) {
        redFlags.push('Requests for upfront fees or payments');
      }

      if (lower.includes('guaranteed') || lower.includes('100% sure') || lower.includes('no interview')) {
        redFlags.push('Unrealistic guarantees (no interview / guaranteed approval)');
      }

      if (lower.includes('whatsapp') || lower.includes('telegram') || lower.includes('dm us')) {
        redFlags.push('Asks you to contact via social media or messaging apps only');
      }

      if (lower.includes('congratulations') && lower.includes('selected') && lower.includes('apply now')) {
        redFlags.push('Mass congratulatory message without prior application');
      }

      if (lower.includes('gift card') || lower.includes('western union')) {
        redFlags.push('Asks for payment through untraceable methods');
      }

      if (!lower.includes('official') && !lower.includes('gov.sg') && !lower.includes('edu.sg') && !lower.includes('org')) {
        redFlags.push('No indication of official organisation or website');
      }

      if (text.trim().length < 40) {
        redFlags.push('Very short / vague description of scholarship');
      }

      return redFlags;
    }

    checkBtn.addEventListener('click', () => {
      const text = offerText.value;
      const flags = analyzeText(text);

      analysis.style.display = 'block';

      if (!text.trim()) {
        analysis.innerHTML = '<strong>Please paste a scholarship message to analyse.</strong>';
        return;
      }

      if (flags.length === 0) {
        analysis.innerHTML = '<span class="risk-low">Low scam risk detected.</span><br>We did not find common red flags. Still verify using official websites.';
        return;
      }

      let risk = 'Medium';
      if (flags.length >= 3) { risk = 'High'; }

      const riskClass = risk === 'High' ? 'risk-high' : (risk === 'Medium' ? 'risk-medium' : 'risk-low');

      analysis.innerHTML = `
        <div>
          <div class="${riskClass}">Scam Risk: ${risk}</div>
          <p>Potential warning signs detected:</p>
          <ul>${flags.map(f => `<li>${f}</li>`).join('')}</ul>
          <p><strong>Safety tips:</strong> Never pay fees, verify using official organisation websites, and be cautious of unsolicited offers.</p>
        </div>
      `;
    });
  </script>

  <!-- Footer -->
    <footer class="footer" role="contentinfo">
        <div class="container">
            <p class="footer-text">&copy; 2026 AI Scholarship Finder</p>
        </div>
    </footer>

</body>
</html>
