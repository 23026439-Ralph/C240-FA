/* ===================================
   SHARED NAVBAR STYLES
   =================================== */

/* CSS Variables */
:root {
    --color-primary: #2563EB;
    --color-neutral-dark: #1E293B;
    --color-white: #FFFFFF;
    --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-size-xl: 24px;
    --spacing-xs: 0.5rem;
    --spacing-md: 1.5rem;
    --spacing-lg: 2rem;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --transition-fast: 150ms ease-in-out;
    --container-width: 1200px;
}

/* Reset */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: var(--font-family);
    background:#f7f9fc;
}

/* Container */
.container {
    width: 100%;
    max-width: var(--container-width);
    margin: 0 auto;
    padding: 0 var(--spacing-md);
}

/* Header / Navbar */
.header {
    background: var(--color-white);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 50;
    padding: var(--spacing-md) 0;
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Logo */
.logo {
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
}

.logo-icon {
    height: 100px;
    width: auto;
    display: block;
}

.logo-text {
    font-size: var(--font-size-xl);
    font-weight: 700;
    color: var(--color-primary);
    margin: 0;
}

/* Navigation */
.nav {
    flex: 1;
    display: flex;
    justify-content: center;
}

.nav-list {
    display: flex;
    list-style: none;
    gap: var(--spacing-lg);
}

.nav-link {
    color: var(--color-neutral-dark);
    text-decoration: none;
    font-weight: 500;
    transition: color var(--transition-fast);
    padding: var(--spacing-xs) 0;
}

.nav-link:hover,
.nav-link:focus {
    color: var(--color-primary);
}

/* Responsive */
@media (max-width: 768px) {
    .header-content {
        flex-direction: column;
        gap: 1rem;
    }

    .nav-list {
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
    }

    .logo-icon {
        height: 60px;
    }
}

/* --- Existing card/filter styles kept --- */

.filters { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
select, input { padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db; min-width: 180px; }
.card { background:white; padding:16px; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); margin-bottom: 14px; }
.card h3 { margin-top:0; margin-bottom:6px; }
.badge { display:inline-block; padding:4px 10px; border-radius:999px; background:#e0e7ff; color:#1e3a8a; margin-right:6px; }
.empty { text-align:center; padding:40px; color:#6b7280; }
footer { text-align:center; padding:16px 8px 32px; font-size: 13px; color:#6b7280; }

  </style>
