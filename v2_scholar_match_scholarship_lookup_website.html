<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScholarMatch – Singapore Scholarship Lookup<\/title>
    <!-- 1. Add this in your <head> section: -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar-styles.css">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; background:#f7f9fc; }
    header { background:#1e3a8a; color:white; padding: 20px 16px; }
    h1 { margin: 0 0 8px 0; font-size: 26px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
    select, input { padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db; min-width: 180px; }
    .card { background:white; padding:16px; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); margin-bottom: 14px; }
    .card h3 { margin-top:0; margin-bottom:6px; }
    .badge { display:inline-block; padding:4px 10px; border-radius:999px; background:#e0e7ff; color:#1e3a8a; margin-right:6px; }
    .empty { text-align:center; padding:40px; color:#6b7280; }
    footer { text-align:center; padding:16px 8px 32px; font-size: 13px; color:#6b7280; }
  </style>
</head>
<body>
  <!-- 2. Add this in your <body> where you want the navbar: -->
<header class="header" role="banner">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <img src="images\/logo.png" alt="ScholarMatch Logo" class="logo-icon">
                <h1 class="logo-text">ScholarMatch<\/h1>
            </div>
            <nav class="nav" role="navigation" aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="#home" class="nav-link">Razul<\/a><\/li>
                    <li><a href="https:\/\/github.com\/TohWangXin\/C240_FA" target="_blank" class="nav-link">WangXin<\/a><\/li>
                    <li><a href="#how-it-works" class="nav-link">Raelyn<\/a><\/li>
                    <li><a href="#about" class="nav-link">Ee Weng<\/a><\/li>
                    <li><a href="#about" class="nav-link">Aung Myin<\/a><\/li>
                </ul>
            </nav>
        <\/div>
    <\/div>
<\/header>

  <div class="container">
    <div class="filters">
      <select id="levelFilter">
        <option value="all">All Levels</option>
        <option value="jc">Junior College</option>
        <option value="poly">Polytechnic</option>
        <option value="uni">University</option>
      </select>

      <select id="typeFilter">
        <option value="all">All Types</option>
        <option value="merit">Merit-based</option>
        <option value="needs">Needs-based / Bursary</option>
        <option value="bonded">Bonded</option>
        <option value="nonbonded">Non-bonded</option>
      </select>

      <input type="text" id="searchBox" placeholder="Search by name or keyword..." />
    </div>

    <div id="results"></div>
  </div>

  <footer>
    ScholarMatch – Simple scholarship lookup (demo). Always verify details with official providers.
  </footer>

  <script>
    // --- Demo data set (you can expand / replace with real data) ---
    const scholarships = [
      {
        name: 'MOE Teaching Scholarship',
        provider: 'Ministry of Education (MOE)',
        level: 'uni',
        type: 'bonded',
        summary: 'Supports aspiring teachers with tuition fees and allowance. Service bond required with MOE.',
        link: 'https://www.moe.gov.sg/'
      },
      {
        name: 'ASEAN Scholarship for JC',
        provider: 'MOE',
        level: 'jc',
        type: 'merit',
        summary: 'For outstanding students from ASEAN member countries to study in Singapore JCs.',
        link: 'https://www.moe.gov.sg/'
      },
      {
        name: 'Polytechnic Foundation Bursary',
        provider: 'Singapore Government',
        level: 'poly',
        type: 'needs',
        summary: 'Financial assistance for full-time polytechnic students from lower- and middle-income households.',
        link: 'https://www.moe.gov.sg/financial-matters'
      },
      {
        name: 'SG Digital Scholarship (Undergraduate)',
        provider: 'IMDA',
        level: 'uni',
        type: 'bonded',
        summary: 'For students pursuing tech-related studies to build Singapore\'s digital future. Service commitment required.',
        link: 'https://www.imda.gov.sg/'
      },
      {
        name: 'NUS Global Merit Scholarship',
        provider: 'National University of Singapore',
        level: 'uni',
        type: 'merit',
        summary: 'Prestigious merit-based award for outstanding undergraduate students at NUS.',
        link: 'https://nus.edu.sg/'
      },
      {
        name: 'Community Development Council Bursary (CDC)',
        provider: 'Singapore Government',
        level: 'poly',
        type: 'needs',
        summary: 'Bursary for polytechnic and ITE students from lower-income households.',
        link: 'https://www.moe.gov.sg/financial-matters'
      }
    ];

    const resultsDiv = document.getElementById('results');
    const levelFilter = document.getElementById('levelFilter');
    const typeFilter = document.getElementById('typeFilter');
    const searchBox = document.getElementById('searchBox');

    function renderResults() {
      const level = levelFilter.value;
      const type = typeFilter.value;
      const text = searchBox.value.toLowerCase();

      const filtered = scholarships.filter(s => {
        const matchesLevel = level === 'all' || s.level === level;
        const matchesType = type === 'all' || s.type === type;
        const matchesText = s.name.toLowerCase().includes(text) || s.summary.toLowerCase().includes(text) || s.provider.toLowerCase().includes(text);
        return matchesLevel && matchesType && matchesText;
      });

      if (!filtered.length) {
        resultsDiv.innerHTML = `<div class='empty'>No scholarships found. Try adjusting filters or keywords.</div>`;
        return;
      }

      resultsDiv.innerHTML = filtered.map(s => `
        <div class="card">
          <span class="badge">${s.level.toUpperCase()}</span>
          <span class="badge">${s.type.replace('-', ' ').toUpperCase()}</span>
          <h3>${s.name}</h3>
          <strong>${s.provider}</strong>
          <p>${s.summary}</p>
          <a href="${s.link}" target="_blank">View details</a>
        </div>
      `).join('');
    }

    levelFilter.addEventListener('change', renderResults);
    typeFilter.addEventListener('change', renderResults);
    searchBox.addEventListener('input', renderResults);

    // initial render
    renderResults();
  </script>
</body>
</html>
